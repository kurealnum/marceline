[package]
name = "core"
version.workspace = true
edition.workspace = true

[lib]
name = "marceline_core"
path = "src/lib.rs"

[dependencies]
protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# Comment- and layout-preserving TOML, for writing single values back to
# a config file a human wrote (config_edit.rs).
toml_edit = "0.22"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["process", "rt-multi-thread", "macros", "sync", "time", "net", "fs"] }
chrono = "0.4"
tonic = "0.12"
tonic-health = "0.12"

async-trait = "0.1"
futures = "0.3"
tokio-util = "0.7"
tower = "0.4"
hyper-util = { version = "0.1", features = ["tokio"] }
cpal = "0.15"
crossbeam-channel = "0.5"
hound = "3"
ort = { version = "2.0.0-rc.12", features = ["download-binaries"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde_json = "1"
bytes = "1"
# Bundled so the daemon doesn't depend on a system libsqlite3 install.
rusqlite = { version = "0.31", features = ["bundled"] }
# Long-term memory vector index (EPIC 10.3): the `vec0` virtual table,
# vendored as C and compiled with `SQLITE_CORE` so it links straight into
# the same process as `rusqlite`'s bundled SQLite — no separate loadable
# `.so`/`.dylib` to ship or `load_extension` dance at runtime. Pinned off
# the `-alpha` track: 0.1.10-alpha.4 ships a C file that `#include`s a
# sibling `sqlite-vec-diskann.c` the crate forgets to package, so it fails
# to compile at all; 0.1.9 is the latest release that actually builds.
sqlite-vec = "0.1.9"
# Local CPU tokenizer for the `all-MiniLM-L6-v2` embedding pipeline (EPIC
# 10.3), matching the model's own WordPiece vocabulary/tokenizer.json.
# The `onig` feature is required, not optional, despite `default-features
# = false`: 0.20.4's `utils/onig.rs` module references the `onig` crate
# unconditionally (not behind `cfg(feature = "onig")`), so the crate fails
# to compile at all without it. `onig_sys` vendors its own oniguruma C
# source, so this still builds fully offline via `cc`.
tokenizers = { version = "0.20", default-features = false, features = ["onig"] }

[dev-dependencies]
# The STT client tests run a fake `Stt` server over a real unix socket,
# which needs the generated server stubs and stream adapters for a
# `UnixListener` / `mpsc` receiver.
tokio-stream = { version = "0.1", features = ["net"] }
# The LLM client tests stub a local OpenAI-compatible HTTP endpoint.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
# `read_file`/`list_dir` tool tests exercise real filesystem paths.
tempfile = "3"
