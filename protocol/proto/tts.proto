syntax = "proto3";

// Streaming text-to-speech contract (SPEC.md §2.4.1, EPIC 0.5): segmented
// text in, PCM audio chunks out.
package marceline.tts;

import "common.proto";

// Bidirectional-streaming TTS service hosted by the Python TTS worker.
service Tts {
  // Streams already-segmented text in (sentence-chunking is the caller's
  // job, §5.3), streams audio chunks out. The client interleaves `Cancel`
  // messages on the request stream to stop in-flight synthesis
  // cooperatively (§2.5.1).
  rpc Synthesize(stream TtsRequest) returns (stream TtsResponse);
  // Reports the loaded backend's capabilities, so the Rust side can build
  // its `TtsInfo` (§2.4) from what the worker actually loaded — voice ids
  // and output sample rate — rather than from what config asked for.
  rpc GetInfo(TtsInfoRequest) returns (TtsInfo);
}

// Empty request for `Tts.GetInfo`; a message (not `Empty`) so capability
// filters can be added later without breaking the RPC signature.
message TtsInfoRequest {}

// Capabilities of the backend this worker actually loaded.
message TtsInfo {
  // Backend/model name, e.g. "kokoro:af_sky".
  string name = 1;
  // Voice ids this backend can synthesize (Kokoro's fixed voice set).
  repeated string voices = 2;
  // Sample rate (Hz) the backend actually emits. Declared here rather than
  // assumed, so a consumer never guesses it (§2.4.1's chipmunk warning).
  uint32 output_sample_rate = 3;
}

// One message on the client-to-server request stream.
message TtsRequest {
  oneof payload {
    // A pre-segmented span of text to synthesize.
    string text = 1;
    // Cooperative cancel signal; worker returns early between decode steps.
    marceline.common.Cancel cancel = 2;
    // Voice id to synthesize with, e.g. "af_sky" (§3.1's `[tts].voice`).
    // Sent at most once, before any `text`; a stream that never sends one
    // uses the worker's configured default voice.
    string voice = 3;
  }
}

// One message on the server-to-client response stream: a chunk of
// synthesized PCM audio.
message TtsResponse {
  marceline.common.AudioChunk audio = 1;
}
